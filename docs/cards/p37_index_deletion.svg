<text x="40" y="40" font-size="24" font-weight="700" fill="#111">P37 지수 편출 이벤트 — MSCI 가 Strategy(MSTR)를 뺀다. 11/30 강제 매도 전후를 잰다 (MSTR 일봉)</text>
<text x="40" y="62" font-size="13" fill="#555">실데이터 2026-07-30 ~ 11-12 (나스닥 정규장). 파란 점선 = IBIT(비트코인 현물 ETF)를 11/10 MSTR 가격에 맞춰 그린 것 — 둘의 차이가 '편출 효과'. 분홍 띠 = 발표(11/11) 이후. 주문 없음, 기록만.</text>
