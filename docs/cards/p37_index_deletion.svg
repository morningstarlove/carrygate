<text x="930" y="90" font-size="14" font-weight="700" fill="#111">■ 어떤 논리로 들어가나</text>
<text x="938" y="110" font-size="12.5" fill="#333">MSCI 11/11 확정: MSTR 를 MSCI</text>
<text x="938" y="127" font-size="12.5" fill="#333">USA·World·ACWI 에서 편출, 11/30 장 마감 뒤</text>
<text x="938" y="144" font-size="12.5" fill="#333">적용. 지수 펀드는 규칙대로 11/30 종가에 판다.</text>
<text x="938" y="161" font-size="12.5" fill="#333">가설(외부 연구에서 흔히 말하는 경향, 우리 자료로는</text>
<text x="938" y="178" font-size="12.5" fill="#333">미확인): 발표~적용일 눌림, 적용 뒤 일부 되돌림. MSTR</text>
<text x="938" y="195" font-size="12.5" fill="#333">는 비트코인을 크게 따라가므로 IBIT 수익을 빼고(초과</text>
<text x="938" y="212" font-size="12.5" fill="#333">수익) 본다.</text>
<text x="938" y="229" font-size="12.5" fill="#333">발표 전날→11/12 실데이터: MSTR −5.5%, IBIT</text>
<text x="938" y="246" font-size="12.5" fill="#333">−3.2%, 초과 −2.3% (규칙 고정 전이라 참고만).</text>
<text x="930" y="273" font-size="14" font-weight="700" fill="#111">■ 진입</text>
<text x="938" y="293" font-size="12.5" fill="#333">A 적용 전: 11/13 종가 → 11/30 종가 초과 수익</text>
<text x="938" y="310" font-size="12.5" fill="#333">기록(가설 &lt; 0). B 적용 뒤: 11/30 종가에 MSTR</text>
<text x="938" y="327" font-size="12.5" fill="#333">사고 같은 금액 IBIT 판 것으로 종이 기록.</text>
<text x="930" y="354" font-size="14" font-weight="700" fill="#111">■ 청산</text>
<text x="938" y="374" font-size="12.5" fill="#333">B 는 20거래일 뒤(약 12/29) 종가에 둘 다 정리.</text>
<text x="938" y="391" font-size="12.5" fill="#333">비용 = 체결 4번 × 0.05% = 0.2%.</text>
<text x="930" y="418" font-size="14" font-weight="700" fill="#1a7f37">■ 목표</text>
<text x="938" y="438" font-size="12.5" fill="#333">B 초과 수익 − 비용 &gt; 0 이면 '편출 뒤 되돌림' 가설</text>
<text x="938" y="455" font-size="12.5" fill="#333">1건 성립. 1건이라 실거래 제안은 같은 종류 이벤트 5건</text>
<text x="938" y="472" font-size="12.5" fill="#333">이상 쌓인 뒤.</text>
<text x="930" y="499" font-size="14" font-weight="700" fill="#1a7f37">■ 기대값 (수수료 뺀 뒤)</text>
<text x="938" y="519" font-size="12.5" fill="#333">우리 실데이터 근거 없음 — 이 1건이 첫 기록. 비용</text>
<text x="938" y="536" font-size="12.5" fill="#333">0.2% 를 넘어야 의미가 있고, MSTR 일 변동이 5% 를</text>
<text x="938" y="553" font-size="12.5" fill="#333">넘는 날이 많아 한 건으론 운과 구별이 안 된다.</text>
<text x="930" y="580" font-size="14" font-weight="700" fill="#b35c00">■ 결과 예측</text>
<text x="938" y="600" font-size="12.5" fill="#333">A 는 음수(눌림) 쪽이 기본. B 는 비트코인 방향보다 '팔</text>
<text x="938" y="617" font-size="12.5" fill="#333">사람이 다 판 뒤' 효과를 본다 — IBIT 를 빼 비트코인</text>
<text x="938" y="634" font-size="12.5" fill="#333">영향을 지운다.</text>
<text x="930" y="661" font-size="14" font-weight="700" fill="#b00020">■ 위험 / 틀리면</text>
<text x="938" y="681" font-size="12.5" fill="#333">다른 지수(S&amp;P·나스닥)도 따라 빼면 매도가 이어져 B</text>
<text x="938" y="698" font-size="12.5" fill="#333">손실. 회사가 이의 제기로 결정이 바뀌면 이벤트 무효로 기록.</text>
<text x="930" y="725" font-size="14" font-weight="700" fill="#111">■ 다음 판정</text>
<text x="938" y="745" font-size="12.5" fill="#333">매일 daily 'Index deletion event' 단계</text>
<text x="938" y="762" font-size="12.5" fill="#333">→ index_event.json. A 끝 11/30, B 끝</text>
<text x="938" y="779" font-size="12.5" fill="#333">약 2026-12-29. 규칙 P37,</text>
<text x="938" y="796" font-size="12.5" fill="#333">index_event.py.</text>
