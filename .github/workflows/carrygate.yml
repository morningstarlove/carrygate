name: CARRYGATE daily

on:
  schedule:
    - cron: "18 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "결과만 확인하고 커밋하지 않음 (테스트용)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch Upbit data (게이트)
        id: fetch
        continue-on-error: true
        run: python fetch.py

      - name: Fetch funding rates (캐리)
        id: funding
        continue-on-error: true
        run: python funding.py

      - name: Show results
        if: always()
        run: |
          echo "=== status.json ==="
          python -c "import json;print(json.dumps(json.load(open('status.json',encoding='utf-8'))['summary'],ensure_ascii=False,indent=2))" || echo "없음"
          echo "=== funding.json ==="
          python -c "import json;d=json.load(open('funding.json',encoding='utf-8'));print(json.dumps({'summary':d['summary'],'sources_ok':d['sources_ok'],'sources_failed':d['sources_failed']},ensure_ascii=False,indent=2))" || echo "없음"
          echo "=== 코인별 연환산 ==="
          python -c "import json;d=json.load(open('funding.json',encoding='utf-8'));[print('%-5s best=%-12s 순%7.2f%% (총%7.2f%%)  순중앙값=%7.2f%%  venues=%d  기준=%s'%(c,v['best']['venue'],v['best']['decision_apr_pct'],v['best']['gross_apr_pct'],v['median_apr_pct'],v['venue_count'],v['best']['basis'])) for c,v in d['coins'].items()]" || echo "없음"

      - name: Show trend (며칠치 추이)
        if: always()
        run: python report.py || echo "기록 없음"

      - name: Commit results
        if: always() && inputs.dry_run != true
        run: |
          git config user.name  "carrygate-bot"
          git config user.email "carrygate-bot@users.noreply.github.com"
          git add -A status.json history.jsonl funding.json funding_history.jsonl || true
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "status $(date -u +%Y-%m-%d)"
            git push
          fi

      # 저장된 값을 다시 계산해 대조한다. 어긋나면 여기서 실패해 빨간불로 알린다.
      - name: Selfcheck (검산)
        if: always()
        run: python selfcheck.py
