name: CARRYGATE daily

on:
  schedule:
    - cron: "18 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "결과만 확인하고 커밋하지 않음 (테스트용)"
        type: boolean
        default: false
      day:
        description: "초단타 되채우기: 평가할 날짜(UTC, YYYY-MM-DD). 지정하면 초단타·보조 연구만 그 날짜로 돌려 저장"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch Upbit data (게이트)
        if: inputs.day == ''
        id: fetch
        continue-on-error: true
        run: python fetch.py

      - name: Fetch funding rates (캐리)
        if: inputs.day == ''
        id: funding
        continue-on-error: true
        run: python funding.py

      - name: Fetch 1m candles + scalp research (초단타)
        id: scalp
        continue-on-error: true
        run: python scalp.py ${{ inputs.day != '' && format('--day {0}', inputs.day) || '' }}

      - name: Scalp side research (시간대·펀딩·선행후행)
        id: research
        continue-on-error: true
        run: python scalp_research.py

      # ---- 중기·장기·이벤트 연구 (마일스톤 7). 각 단계는 실패해도 다음으로 넘어간다.
      - name: Basis carry (분기 선물 베이시스)
        if: inputs.day == ''
        continue-on-error: true
        run: python basis.py

      - name: Funding extreme signal (펀딩 극단값 역추세)
        if: inputs.day == ''
        continue-on-error: true
        run: python funding_signal.py

      - name: Kimchi premium (김치프리미엄)
        if: inputs.day == ''
        continue-on-error: true
        run: python kimchi.py

      - name: Macro events (매크로 발표 전후)
        if: inputs.day == ''
        continue-on-error: true
        run: python macro_events.py

      - name: Upbit listings (상장 공지 반응)
        if: inputs.day == ''
        continue-on-error: true
        run: python listing.py

      - name: Turtle trend rules (터틀 20일 돌파, 중기)
        if: inputs.day == ''
        continue-on-error: true
        run: python turtle.py

      - name: Trend reversal rules (추세 전환 4시간봉, 중기)
        if: inputs.day == ''
        continue-on-error: true
        run: python reversal.py

      - name: Verdict (판정 규율 — 네 트랙 순방향 채점, 사전 등록 기준)
        if: inputs.day == ''
        continue-on-error: true
        run: python verdict.py

      - name: Live carry monitor (실전 캐리 감시, 지갑 주소만)
        if: inputs.day == ''
        continue-on-error: true
        run: python live_monitor.py

      - name: ETF daily update + dual momentum (장기)
        if: inputs.day == ''
        continue-on-error: true
        run: |
          python etf_update.py || echo "ETF 갱신 실패 — 기존 자료로 계산"
          python momentum.py

      - name: Grid (종사종팔 v4/v5 — SOXL·TQQQ 백테스트 + 순방향 기록, 중기)
        continue-on-error: true
        run: python grid.py

      - name: Show results
        if: always()
        run: |
          echo "=== status.json ==="
          python -c "import json;print(json.dumps(json.load(open('status.json',encoding='utf-8'))['summary'],ensure_ascii=False,indent=2))" || echo "없음"
          echo "=== funding.json ==="
          python -c "import json;d=json.load(open('funding.json',encoding='utf-8'));print(json.dumps({'summary':d['summary'],'sources_ok':d['sources_ok'],'sources_failed':d['sources_failed']},ensure_ascii=False,indent=2))" || echo "없음"
          echo "=== 하이퍼리퀴드 수수료 (실측) ==="
          python -c "import json;d=json.load(open('funding.json',encoding='utf-8'));print(json.dumps(d['fee_assumption']['hyperliquid'],ensure_ascii=False,indent=2))" || echo "없음"
          echo "=== 코인별 연환산 ==="
          python -c "import json;d=json.load(open('funding.json',encoding='utf-8'));[print('%-5s best=%-12s 순%7.2f%% (총%7.2f%% 수수료%5.2f%%)  venues=%d  기준=%s  [%s]'%(c,v['best']['venue'],v['best']['decision_apr_pct'],v['best']['gross_apr_pct'],v['best']['fee_drag_apr_pct'],v['venue_count'],v['best']['basis'],v['best'].get('fee_note',''))) for c,v in d['coins'].items()]" || echo "없음"

      - name: Show trend (며칠치 추이)
        if: always()
        run: python report.py || echo "기록 없음"

      - name: Show scalp trend (초단타 누적 성적)
        if: always()
        run: python scalp.py --report || echo "초단타 기록 없음"

      - name: Show turtle trend (터틀 신호 추이)
        if: always()
        run: python turtle.py --report || echo "터틀 기록 없음"

      - name: Show reversal trend (추세 전환 신호 추이)
        if: always()
        run: python reversal.py --report || echo "추세 전환 기록 없음"

      - name: Show grid trend (그리드 순방향 계좌)
        if: always()
        run: python grid.py --report || echo "그리드 기록 없음"

      - name: Show research trend (보조 연구 누적)
        if: always()
        run: python scalp_research.py --report || echo "연구 기록 없음"

      - name: Unit tests (계산 로직)
        if: always()
        run: python -m unittest tests.test_scalp tests.test_research tests.test_midterm tests.test_momentum tests.test_live tests.test_turtle tests.test_reversal tests.test_relay tests.test_verdict tests.test_grid

      - name: Commit results
        if: always() && inputs.dry_run != true
        run: |
          git config user.name  "carrygate-bot"
          git config user.email "carrygate-bot@users.noreply.github.com"
          # 없는 파일(예: 실전 지갑 미설정 때의 live.json)이 하나라도 섞이면 git add 전체가 실패해
          # 아무것도 저장되지 않는다(2026-10-02~04 결과 유실). 있는 경로만 하나씩 추가한다.
          for p in status.json history.jsonl funding.json funding_history.jsonl scalp.json scalp_history.jsonl research.json research_history.jsonl \
                   basis.json basis_history.jsonl funding_signal.json funding_signal_history.jsonl kimchi.json kimchi_history.jsonl \
                   macro.json listing.json momentum.json momentum_history.jsonl live.json live_history.jsonl turtle.json turtle_history.jsonl reversal.json reversal_history.jsonl verdict.json verdict_history.jsonl \
                   grid.json grid_history.jsonl \
                   data/kr_funding.json data/cg_funding_snapshots.jsonl data/etf data/upbit_markets.json; do
            if [ -e "$p" ]; then git add -A "$p"; else echo "없음(건너뜀): $p"; fi
          done
          if git diff --staged --quiet; then
            echo "no change"
          else
            if [ -n "${{ inputs.day }}" ]; then
              git commit -m "scalp backfill ${{ inputs.day }}"
            else
              git commit -m "status $(date -u +%Y-%m-%d)"
            fi
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      # 저장된 값을 다시 계산해 대조한다. 어긋나면 여기서 실패해 빨간불로 알린다.
      - name: Selfcheck (검산)
        if: always()
        run: python selfcheck.py
