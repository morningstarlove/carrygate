name: CARRYGATE reversal 4h (추세 전환, 4시간봉 닫힌 직후)

# 추세 전환 매매법(reversal.py)만 4시간봉이 닫힌 직후 다시 돌린다 (제안함 P3, 2026-11-01 반영).
# 봉은 00·04·08·12·16·20 UTC 에 닫힌다. 7분 뒤 실행(예약은 몇 분~수십 분 늦게 뜰 수 있다 — 늦어도 그 봉 기준으로 계산되므로 문제 없다).
# 규칙은 그대로이고 기록 빈도만 늘린 것. 하루 1회 CARRYGATE daily 도 계속 돈다(같은 봉은 덮어쓴다).
on:
  schedule:
    - cron: "7 0,4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "결과만 확인하고 커밋하지 않음 (테스트용)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: reversal-4h
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Trend reversal rules (추세 전환 4시간봉)
        id: reversal
        continue-on-error: true
        run: python reversal.py

      - name: Show trend (단계 변화)
        if: always()
        run: python reversal.py --report || echo "추세 전환 기록 없음"

      - name: Unit tests (계산 로직)
        if: always()
        run: python -m unittest tests.test_reversal

      - name: Commit results
        if: always() && inputs.dry_run != true && steps.reversal.outcome == 'success'
        run: |
          git config user.name  "carrygate-bot"
          git config user.email "carrygate-bot@users.noreply.github.com"
          # daily 도 reversal_* 를 쓴다. 겹치면 봉·날짜 기록을 합쳐 올린다 (push_results.py, 최대 5번 재시도)
          python push_results.py -m "reversal 4h $(date -u +%Y-%m-%dT%H:%M)" reversal.json reversal_history.jsonl reversal_bars.jsonl

      # 저장된 값을 다시 계산해 대조한다. 어긋나면 여기서 실패해 빨간불로 알린다.
      - name: Selfcheck (검산)
        if: always()
        run: python selfcheck.py
